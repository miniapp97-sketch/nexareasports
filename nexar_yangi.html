 setTx(){const x=S.set=S.set||{};form("Matnlar va havolalar",[{k:"sup",l:"Qo'llab-quvvatlash username",v:x.sup||AUN},{k:"ucT",l:"UC bo'limi sarlavhasi",v:x.ucT||"PUBG Mobile"},{k:"ucD",l:"UC bo'limi tavsifi",v:x.ucD||""},{k:"minWd",l:"UC yechish minimal miqdori",t:"num",v:x.minWd||0},{k:"card",l:"To'lov karta raqami",v:x.card||""},{k:"cardName",l:"Karta egasi",v:x.cardName||""},{k:"terms",l:"Foydalanish shartlari",t:"area",v:x.terms||DT},{k:"rent",l:"Arenda (ijara) shartlari",t:"area",v:x.rent||DR},{k:"priv",l:"Maxfiylik siyosati",t:"area",v:x.priv||DP}],o=>{Object.assign(x,o);x.sup=(x.sup||"").replace("@","")||AUN;save();toast("Saqlandi")})},
 setMk(){form("Marketplace bo'lim nomlari",MK.map(x=>({k:x[0],l:x[1],v:(S.mk||{})[x[0]]||x[1]})),o=>{S.mk=o;save();render()})},
 setBd(){form("Nishonlar (har qatorda: emoji|NOM|tavsif)",[{k:"b",l:"Ro'yxat",t:"area",v:BDl().map(b=>b.join("|")).join("\n")}],o=>{S.bd=o.b.split("\n").map(l=>l.split("|")).filter(p=>p[1]).map(p=>[p[0].trim()||"🏆",p[1].trim(),(p[2]||"").trim()]);save();render()})},
 setAd(){form("Qo'shimcha adminlar",[{k:"a",l:"Telegram ID lar (vergul bilan)",v:(S.admins||[]).join(",")}],o=>{S.admins=o.a.split(",").map(x=>+x.trim()).filter(Boolean);save();toast("Saqlandi")})},
 cancelSel(){sel=null;render()},
 usr(d){const u=S.users[d.id];if(!u)return;box(`<h3>${u.blk?"🚫 ":""}${esc(u.n||"—")}</h3><p class="sub">${u.un?"@"+esc(u.un)+" · ":""}ID ${d.id} · ${u.uc} UC</p><div class="rw"><button class="bt pr" data-a="uUC" data-id="${d.id}" data-s="1">UC sovg'a</button><button class="bt" data-a="uUC" data-id="${d.id}" data-s="-1">UC olib qo'yish</button></div><p class="sub" style="margin:12px 0 4px">Nishonlar (bosib bering / oling)</p><div class="ch">${BDl().map((b,i)=>`<span data-a="uBd" data-id="${d.id}" data-i="${i}" style="cursor:pointer;${(u.b||[]).includes(i)?"border-color:var(--a2)":"opacity:.4"}">${b[0]} ${esc(b[1])}</span>`).join("")}</div><button class="bt ${u.blk?"pr":""}" data-a="uBlk" data-id="${d.id}">${u.blk?"Blokdan ochish":"🚫 Bloklash"}</button>`)},
 uUC(d){const k=d.s==="1"?1:-1;form(k>0?"UC sovg'a qilish":"UC olib qo'yish",[{k:"v",l:"UC miqdori",t:"num"}],o=>{const v=+o.v;if(!v)return;const u=U(d.id),nv=Math.max(0,u.uc+k*v);u.h.unshift({d:today(),t:k>0?"Admin sovg'asi":"Admin ayirdi",v:nv-u.uc});u.uc=nv;save();render();setTimeout(()=>A.usr(d),0)})},
 uBd(d){const u=U(d.id),i=+d.i;u.b=u.b||[];const j=u.b.indexOf(i);j<0?u.b.push(i):u.b.splice(j,1);save();A.usr(d)},
 uBlk(d){if(+d.id===AID)return toast("Adminni bloklab bo'lmaydi");const u=U(d.id);u.blk=!u.blk;save();render();A.usr(d)},
 apr(d){cur().pl[d.k].ok=1;save();render()},rej(d){delete cur().pl[d.k];save();render()},
 pay(){const t=cur(),k=Object.keys(t.pl).find(k=>t.pl[k].uid===me.id);link(`https://t.me/${sup()}?text=`+encodeURIComponent(`Salom! "${t.n}" uchun to'lov qildim. Joy #${k}, ID: ${me.id}`))},
 timg(){pick(d=>{cur().img=d;save();render()})},iimg(d){const i=S.market[V.id].find(i=>i.id===d.id);pick(x=>{i.im=(i.im||[]).concat(x).slice(-4);save();render()})},
 setBr(){const t=cur();form("Setka",[{k:"n",l:"Ishtirokchilar (vergul bilan, 2-16)"}],o=>{const a=o.n.split(",").map(x=>x.trim()).filter(Boolean).slice(0,16);if(a.length<2)return;let n=2;while(n<a.length)n*=2;while(a.length<n)a.push("BYE");
  let c=a.map((x,i)=>i%2?null:{a:x,b:a[i+1],w:0}).filter(Boolean);const r=[c];while(c.length>1){c=Array.from({length:c.length/2},()=>({a:"",b:"",w:0}));r.push(c)}t.br={r};save();render()})},
 win(d){const t=cur(),r=+d.r,m=+d.m,x=t.br.r[r][m];form(`G'olib: 1 = ${x.a}, 2 = ${x.b}`,[{k:"w",l:"1 yoki 2",t:"number"}],o=>{const w=+o.w;if(w!==1&&w!==2)return;x.w=w;const nx=t.br.r[r+1];if(nx)nx[m>>1][m%2?"b":"a"]=w===1?x.a:x.b;save();render()})},
 leave(){const t=cur(),k=Object.keys(t.pl).find(k=>t.pl[k].uid===me.id);delete t.pl[k];save();render()},
 fin(){const t=cur(),ks=Object.keys(t.pl).filter(k=>t.pl[k].ok!==0),fs=[];
  ks.forEach(k=>fs.push({k:"k"+k,l:`#${k} ${t.pl[k].nick} — kill`,t:"number",v:0},{k:"p"+k,l:`#${k} — ochko`,t:"number",v:0},{k:"u"+k,l:`#${k} — yutuq UC`,t:"number",v:0}));
  form("Natijalarni kiriting",fs,o=>{t.res=ks.map(k=>({k,uid:t.pl[k].uid,nick:t.pl[k].nick,kills:+o["k"+k]||0,pts:+o["p"+k]||0,uc:+o["u"+k]||0}));
   t.res.forEach(r=>{if(r.uc>0){const u=U(r.uid);u.uc+=r.uc;u.h.unshift({d:today(),t:"Turnir: "+t.n,v:r.uc})}});t.st="done";save();beep(880);render()})},
 addI(){if(V.id==="uc")return form("Yangi paket",[{k:"t",l:"UC miqdori",t:"num"},{k:"p",l:"Narxi (so'm)",t:"num"}],o=>{if(!o.t)return;S.market.uc.push({id:rid(),t:o.t,p:o.p,d:"",im:[],s:0});save();render()});
 if(V.id==="rent")return form("Yangi arenda akkaunt",[{k:"t",l:"Akkaunt nomi"},{k:"p",l:"Ijara narxi (so'm)",t:"num"},{k:"u",l:"Muddat birligi (soat / kun)",v:"soat"},{k:"dep",l:"Depozit (so'm)",t:"num"},{k:"mn",l:"Minimal muddat (masalan 3 soat)"},{k:"d",l:"Akkaunt haqida to'liq ma'lumot (level, skinlar, rank...)",t:"area"},{k:"img",l:"Rasm",t:"img"}],o=>{if(!o.t)return;S.market.rent.push({id:rid(),t:o.t,p:o.p,u:o.u||"soat",dep:o.dep,mn:o.mn,d:o.d,im:o.img?[o.img]:[],s:0});save();render()});
 form("Yangi e'lon",[{k:"t",l:"Nomi"},{k:"p",l:"Narxi (so'm)",t:"num"},{k:"o",l:"Eski narx (ixtiyoriy)",t:"num"},{k:"d",l:"To'liq ma'lumot (level, skinlar...)",t:"area"},{k:"img",l:"Rasm (UC uchun shart emas)",t:"img"}],o=>{if(!o.t)return;S.market[V.id].push({id:rid(),t:o.t,p:o.p,d:o.d,im:o.img?[o.img]:[],o:o.o,s:0});save();render()})},
 delI(d){S.market[V.id]=S.market[V.id].filter(i=>i.id!==d.id);save();render()},
 sold(d){const i=S.market[V.id].find(i=>i.id===d.id);i.s=i.s?0:1;save();render()},
 buy(d){const i=S.market[V.id].find(i=>i.id===d.id);link(`https://t.me/${sup()}?text=`+encodeURIComponent(`Salom! ${V.id==="rent"?"ARENDA":"SOTIB OLISH"}: "${i.t}" (${i.p}) kerak. ID: ${me.id}`))},
 cash(){const u=U(),pa=u.pa||[];if(!pa.length)return toast("Avval ID va nikneym qo'shing");
  form("UC yechish arizasi",[{k:"amt",l:`UC miqdori (balans: ${u.uc})`,t:"num"},{k:"pid",l:"ID: "+pa.map(a=>a.pid).join(", "),t:"num",v:pa[0].pid}],o=>{const a=+o.amt,p=pa.find(x=>x.pid===o.pid);if(!a)return toast("Miqdorni kiriting");if(a<((S.set||{}).minWd||0))return toast("Minimal miqdor: "+S.set.minWd+" UC");if(a>u.uc)return toast("Balans yetarli emas");if(!p)return toast("ID ro'yxatda yo'q");
   u.uc-=a;u.h.unshift({d:today(),t:"UC yechish arizasi",v:-a});S.wd.push({id:rid(),uid:me.id,n:me.name,un:me.un,amt:a,pid:p.pid,nk:p.nk,st:0,d:today()});save();toast("Ariza yuborildi");render()})},
 wdOk(d){S.wd.find(x=>x.id===d.id).st=1;save();render()},
 wdNo(d){const w=S.wd.find(x=>x.id===d.id);w.st=2;const u=U(w.uid);u.uc+=w.amt;u.h.unshift({d:today(),t:"Ariza rad etildi (qaytarildi)",v:w.amt});save();render()},
 redeem(){const c=($("#pc").value||"").trim().toUpperCase(),p=S.promos.find(p=>p.code===c);
  if(!p)return toast("Promokod topilmadi");if(p.used.includes(me.id))return toast("Allaqachon ishlatgansiz");if(p.max&&p.used.length>=p.max)return toast("Promokod tugagan");
  p.used.push(me.id);const u=U();u.uc+=p.uc;u.h.unshift({d:today(),t:"Promokod "+c,v:p.uc});save();beep(880);toast(`+${p.uc} UC 🎉`);render()},
 addP(){form("Yangi promokod",[{k:"c",l:"Kod"},{k:"uc",l:"UC miqdori",t:"number",v:60},{k:"max",l:"Necha kishi (0 = cheksiz)",t:"number",v:0}],o=>{if(!o.c)return;S.promos.push({code:o.c.toUpperCase(),uc:+o.uc||0,max:+o.max||0,used:[]});save();render()})},
 delP(d){S.promos=S.promos.filter(p=>p.code!==d.id);save();render()},
 setNews(){form("E'lon",[{k:"n",l:"Matn",v:S.news}],o=>{S.news=o.n;save();toast("Saqlandi")})},
 giveUC(){form("UC berish",[{k:"id",l:"Telegram ID"},{k:"v",l:"UC (minus = ayirish)",t:"number"}],o=>{const v=+o.v;if(!o.id||!v)return;const u=U(o.id);u.uc=Math.max(0,u.uc+v);u.h.unshift({d:today(),t:"Admin",v});save();render()})}
};
